<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 300" font-family="'JetBrains Mono','Courier New',monospace">
  <defs>
    <marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5afa8e"/>
    </marker>
    <marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3d4459"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="300" fill="#0d0f14"/>

  <!-- stage connectors -->
  <line x1="280" y1="150" x2="316" y2="150" stroke="#5afa8e" stroke-width="2" marker-end="url(#m1)"/>
  <line x1="580" y1="150" x2="616" y2="150" stroke="#5afa8e" stroke-width="2" marker-end="url(#m1)"/>
  <line x1="880" y1="150" x2="916" y2="150" stroke="#3d4459" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#m2)"/>

  <!-- Stage 1 -->
  <rect x="20" y="30" width="260" height="240" rx="8" fill="#0e1118" stroke="#5afa8e" stroke-width="1.5"/>
  <text x="150" y="56" fill="#5afa8e" font-size="12" font-weight="600" text-anchor="middle">CHECKPOINT 1</text>
  <text x="150" y="74" fill="#e2e6f0" font-size="12.5" text-anchor="middle">First durable DB</text>
  <g font-size="11" fill="#b8c4e0">
    <rect x="40" y="90" width="100" height="30" rx="4" fill="#13161e" stroke="#1f2535"/><text x="90" y="109" text-anchor="middle">0 Skeleton</text>
    <rect x="150" y="90" width="100" height="30" rx="4" fill="#13161e" stroke="#1f2535"/><text x="200" y="109" text-anchor="middle">1 WAL</text>
    <rect x="40" y="130" width="100" height="30" rx="4" fill="#13161e" stroke="#1f2535"/><text x="90" y="149" text-anchor="middle">2 MemTable</text>
    <rect x="150" y="130" width="100" height="30" rx="4" fill="#13161e" stroke="#1f2535"/><text x="200" y="149" text-anchor="middle">3 SST Writer</text>
    <rect x="40" y="170" width="100" height="30" rx="4" fill="#13161e" stroke="#1f2535"/><text x="90" y="189" text-anchor="middle">4 SST Reader</text>
    <rect x="150" y="170" width="100" height="30" rx="4" fill="#13161e" stroke="#1f2535"/><text x="200" y="189" text-anchor="middle">6 Flush</text>
  </g>
  <text x="150" y="222" fill="#7a8299" font-size="10.5" text-anchor="middle">WAL · memtable · SSTable</text>
  <text x="150" y="238" fill="#7a8299" font-size="10.5" text-anchor="middle">read/write · flush</text>

  <!-- Stage 2 -->
  <rect x="320" y="30" width="260" height="240" rx="8" fill="#0e1118" stroke="#5afa8e" stroke-width="1.5"/>
  <text x="450" y="56" fill="#5afa8e" font-size="12" font-weight="600" text-anchor="middle">CHECKPOINT 2</text>
  <text x="450" y="74" fill="#e2e6f0" font-size="12.5" text-anchor="middle">First ACID DB</text>
  <g font-size="10.5" fill="#b8c4e0">
    <rect x="335" y="90" width="115" height="26" rx="4" fill="#13161e" stroke="#1f2535"/><text x="392" y="107" text-anchor="middle">2.5 WriteBatch</text>
    <rect x="460" y="90" width="105" height="26" rx="4" fill="#13161e" stroke="#1f2535"/><text x="512" y="107" text-anchor="middle">5 Bloom</text>
    <rect x="335" y="124" width="115" height="26" rx="4" fill="#13161e" stroke="#1f2535"/><text x="392" y="141" text-anchor="middle">7 Manifest</text>
    <rect x="460" y="124" width="105" height="26" rx="4" fill="#13161e" stroke="#1f2535"/><text x="512" y="141" text-anchor="middle">8 Merge Iter</text>
    <rect x="335" y="158" width="115" height="26" rx="4" fill="#13161e" stroke="#1f2535"/><text x="392" y="175" text-anchor="middle">9 Compaction</text>
    <rect x="460" y="158" width="105" height="26" rx="4" fill="#13161e" stroke="#1f2535"/><text x="512" y="175" text-anchor="middle">10 Snapshots</text>
    <rect x="335" y="192" width="115" height="26" rx="4" fill="#13161e" stroke="#1f2535"/><text x="392" y="209" text-anchor="middle">11 Benchmarks</text>
    <rect x="460" y="192" width="105" height="26" rx="4" fill="#13161e" stroke="#5afa8e"/><text x="512" y="209" fill="#5afa8e" text-anchor="middle">12 Txns</text>
  </g>
  <text x="450" y="238" fill="#7a8299" font-size="10.5" text-anchor="middle">snapshots · compaction · OCC</text>

  <!-- Stage 3 -->
  <rect x="620" y="30" width="260" height="240" rx="8" fill="#0e1118" stroke="#5afa8e" stroke-width="1.5"/>
  <text x="750" y="56" fill="#5afa8e" font-size="12" font-weight="600" text-anchor="middle">CHECKPOINT 3</text>
  <text x="750" y="74" fill="#e2e6f0" font-size="12.5" text-anchor="middle">1-writer / N-reader DB</text>
  <rect x="675" y="120" width="150" height="60" rx="6" fill="#13161e" stroke="#5afa8e" stroke-width="1.5"/>
  <text x="750" y="145" fill="#5afa8e" font-size="12" font-weight="600" text-anchor="middle">13 Read</text>
  <text x="750" y="163" fill="#5afa8e" font-size="12" font-weight="600" text-anchor="middle">replicas</text>
  <text x="750" y="238" fill="#7a8299" font-size="10.5" text-anchor="middle">shared storage, no log shipping</text>

  <!-- Stage 4 (future) -->
  <rect x="920" y="30" width="240" height="240" rx="8" fill="#0e1118" stroke="#1f2535" stroke-dasharray="5 4"/>
  <text x="1040" y="56" fill="#7a8299" font-size="12" font-weight="600" text-anchor="middle">BEYOND</text>
  <text x="1040" y="74" fill="#7a8299" font-size="12.5" text-anchor="middle">not built yet</text>
  <rect x="965" y="120" width="150" height="60" rx="6" fill="#0e1118" stroke="#3d4459" stroke-dasharray="4 3"/>
  <text x="1040" y="145" fill="#7a8299" font-size="12" text-anchor="middle">14 Staleness</text>
  <text x="1040" y="163" fill="#3d4459" font-size="10.5" text-anchor="middle">tracking</text>
</svg>
