<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" font-family="'JetBrains Mono','Courier New',monospace">
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b8c4e0"/>
    </marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5afa8e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="560" fill="#0d0f14"/>

  <!-- lifelines -->
  <g stroke="#1f2535" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="80" y1="70" x2="80" y2="520"/>
    <line x1="270" y1="70" x2="270" y2="520"/>
    <line x1="460" y1="70" x2="460" y2="520"/>
    <line x1="650" y1="70" x2="650" y2="520"/>
    <line x1="850" y1="70" x2="850" y2="520"/>
  </g>

  <!-- actor headers -->
  <g>
    <rect x="30" y="20" width="100" height="42" rx="5" fill="#161c2e" stroke="#1f2535"/>
    <text x="80" y="46" fill="#e2e6f0" font-size="13" font-weight="600" text-anchor="middle">Txn</text>

    <rect x="200" y="20" width="140" height="42" rx="5" fill="#161c2e" stroke="#5afa8e"/>
    <text x="270" y="46" fill="#5afa8e" font-size="13" font-weight="600" text-anchor="middle">Writer</text>

    <rect x="410" y="20" width="100" height="42" rx="5" fill="#161c2e" stroke="#1f2535"/>
    <text x="460" y="46" fill="#e2e6f0" font-size="13" font-weight="600" text-anchor="middle">WAL</text>

    <rect x="590" y="20" width="120" height="42" rx="5" fill="#161c2e" stroke="#1f2535"/>
    <text x="650" y="46" fill="#e2e6f0" font-size="13" font-weight="600" text-anchor="middle">MemTable</text>

    <rect x="800" y="20" width="100" height="42" rx="5" fill="#161c2e" stroke="#1f2535"/>
    <text x="850" y="46" fill="#e2e6f0" font-size="13" font-weight="600" text-anchor="middle">Readers</text>
  </g>

  <!-- 1. T -> W : commit(...) -->
  <line x1="80" y1="90" x2="264" y2="90" stroke="#b8c4e0" stroke-width="1.5" marker-end="url(#a1)"/>
  <text x="82" y="82" fill="#b8c4e0" font-size="11.5">commit(writeSet, snapshotSeq, readSet)</text>

  <!-- 2. W self: validate readSet -->
  <path d="M270,112 h72 v26 h-72" fill="none" stroke="#7a8299" stroke-width="1.5" marker-end="url(#a1)"/>
  <text x="352" y="122" fill="#7a8299" font-size="11">1. validate readSet — any key</text>
  <text x="352" y="136" fill="#7a8299" font-size="11">seq &gt; snapshotSeq? → ErrConflict</text>

  <!-- 3. W self: assign seq range -->
  <path d="M270,158 h72 v26 h-72" fill="none" stroke="#7a8299" stroke-width="1.5" marker-end="url(#a1)"/>
  <text x="352" y="168" fill="#7a8299" font-size="11">2. assign seq range [n+1 .. n+k]</text>

  <!-- 4. W -> L : append ONE batch record -->
  <line x1="270" y1="204" x2="454" y2="204" stroke="#b8c4e0" stroke-width="1.5" marker-end="url(#a1)"/>
  <text x="272" y="196" fill="#b8c4e0" font-size="11.5">3. append ONE batch record</text>

  <!-- 5. L self: fsync -->
  <path d="M460,222 h72 v26 h-72" fill="none" stroke="#5afa8e" stroke-width="1.5" marker-end="url(#a2)"/>
  <text x="542" y="232" fill="#e2e6f0" font-size="11">4. fsync</text>

  <rect x="460" y="258" width="220" height="26" rx="4" fill="#0e1d16" stroke="#2a6644"/>
  <text x="470" y="275" fill="#5afa8e" font-size="10.5" font-weight="600">▸ DURABILITY POINT</text>

  <!-- 6. W -> M : insert entries -->
  <line x1="270" y1="316" x2="644" y2="316" stroke="#b8c4e0" stroke-width="1.5" marker-end="url(#a1)"/>
  <text x="272" y="308" fill="#b8c4e0" font-size="11.5">5. insert all entries into memtable</text>

  <!-- 7. W self: atomic store -->
  <path d="M270,336 h72 v26 h-72" fill="none" stroke="#5afa8e" stroke-width="1.5" marker-end="url(#a2)"/>
  <text x="352" y="346" fill="#e2e6f0" font-size="11">6. atomic.Store(&amp;lastSeq, n+k)</text>

  <rect x="270" y="372" width="220" height="26" rx="4" fill="#0e1d16" stroke="#2a6644"/>
  <text x="280" y="389" fill="#5afa8e" font-size="10.5" font-weight="600">▸ VISIBILITY POINT</text>

  <!-- 8. W --> T : ack -->
  <line x1="270" y1="424" x2="86" y2="424" stroke="#7a8299" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a1)"/>
  <text x="150" y="416" fill="#7a8299" font-size="11.5">ack</text>

  <!-- Note over Readers -->
  <rect x="715" y="450" width="260" height="46" rx="5" fill="#161c2e" stroke="#1f2535"/>
  <text x="845" y="469" fill="#e2e6f0" font-size="11" text-anchor="middle">readers see only</text>
  <text x="845" y="484" fill="#7a8299" font-size="10.5" text-anchor="middle">seq &lt;= atomic.Load(&amp;lastSeq)</text>
</svg>
