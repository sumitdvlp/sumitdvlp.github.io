<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" font-family="'JetBrains Mono','Courier New',monospace">
  <defs>
    <marker id="ra1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5afa8e"/>
    </marker>
    <marker id="ra2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a8299"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1100" height="420" fill="#0d0f14"/>

  <!-- Writer node subgraph -->
  <rect x="20" y="20" width="300" height="380" rx="8" fill="#0e1118" stroke="#1f2535" stroke-dasharray="5 4"/>
  <text x="35" y="44" fill="#7a8299" font-size="11" letter-spacing="1">WRITER NODE</text>

  <rect x="45" y="65" width="115" height="50" rx="6" fill="#13161e" stroke="#1f2535"/>
  <text x="102" y="95" fill="#e2e6f0" font-size="12.5" font-weight="600" text-anchor="middle">MemTable</text>

  <rect x="180" y="65" width="115" height="50" rx="6" fill="#13161e" stroke="#1f2535"/>
  <text x="237" y="95" fill="#e2e6f0" font-size="12.5" font-weight="600" text-anchor="middle">WAL</text>

  <line x1="160" y1="90" x2="178" y2="90" stroke="#7a8299" stroke-width="1.5" marker-end="url(#ra2)"/>

  <rect x="45" y="160" width="250" height="50" rx="6" fill="#13161e" stroke="#5afa8e"/>
  <text x="170" y="190" fill="#5afa8e" font-size="12.5" font-weight="600" text-anchor="middle">SST writer</text>

  <line x1="102" y1="115" x2="120" y2="158" stroke="#5afa8e" stroke-width="1.5" marker-end="url(#ra1)"/>
  <text x="128" y="140" fill="#7a8299" font-size="10.5">flush</text>

  <rect x="45" y="250" width="250" height="50" rx="6" fill="#13161e" stroke="#5afa8e"/>
  <text x="170" y="280" fill="#5afa8e" font-size="12.5" font-weight="600" text-anchor="middle">Compactor</text>

  <!-- Shared storage -->
  <rect x="440" y="165" width="260" height="110" rx="8" fill="#161c2e" stroke="#5afa8e" stroke-width="1.5"/>
  <text x="570" y="207" fill="#5afa8e" font-size="13" font-weight="600" text-anchor="middle">SHARED STORAGE</text>
  <text x="570" y="227" fill="#7a8299" font-size="10.5" text-anchor="middle">SSTables + MANIFEST + WAL</text>

  <line x1="295" y1="185" x2="438" y2="205" stroke="#5afa8e" stroke-width="1.5" marker-end="url(#ra1)"/>
  <line x1="295" y1="275" x2="438" y2="235" stroke="#5afa8e" stroke-width="1.5" marker-end="url(#ra1)"/>

  <!-- Readers -->
  <rect x="870" y="90" width="210" height="55" rx="6" fill="#13161e" stroke="#1f2535"/>
  <text x="975" y="122" fill="#e2e6f0" font-size="13" font-weight="600" text-anchor="middle">Reader node 1</text>

  <rect x="870" y="290" width="210" height="55" rx="6" fill="#13161e" stroke="#1f2535"/>
  <text x="975" y="322" fill="#e2e6f0" font-size="13" font-weight="600" text-anchor="middle">Reader node 2</text>

  <line x1="700" y1="200" x2="868" y2="125" stroke="#5afa8e" stroke-width="1.5" marker-end="url(#ra1)"/>
  <text x="760" y="115" fill="#7a8299" font-size="10.5">tail MANIFEST + WAL</text>

  <line x1="700" y1="240" x2="868" y2="310" stroke="#5afa8e" stroke-width="1.5" marker-end="url(#ra1)"/>

  <!-- leases back to compactor -->
  <path d="M870,135 C 650,235 480,330 297,272" fill="none" stroke="#7a8299" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#ra2)"/>
  <path d="M870,305 C 650,360 480,340 297,282" fill="none" stroke="#7a8299" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#ra2)"/>
  <text x="580" y="378" fill="#7a8299" font-size="10.5" text-anchor="middle">oldest snapshot / lease</text>
</svg>
