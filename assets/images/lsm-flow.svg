<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" font-family="'JetBrains Mono','Courier New',monospace">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5afa8e"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a8299"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="260" fill="#0d0f14"/>

  <!-- connectors -->
  <path d="M130,120 L188,50" stroke="#7a8299" stroke-width="1.5" fill="none" marker-end="url(#arrowMuted)"/>
  <path d="M130,140 L188,205" stroke="#5afa8e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <path d="M360,212.5 L408,212.5" stroke="#5afa8e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="384" y="200" fill="#7a8299" font-size="11" text-anchor="middle">full</text>

  <path d="M580,212.5 L628,212.5" stroke="#5afa8e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="604" y="200" fill="#7a8299" font-size="11" text-anchor="middle">flush</text>

  <path d="M760,212.5 L808,212.5" stroke="#5afa8e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="784" y="200" fill="#7a8299" font-size="11" text-anchor="middle">compact</text>

  <path d="M910,212.5 L958,212.5" stroke="#5afa8e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="934" y="200" fill="#7a8299" font-size="11" text-anchor="middle">compact</text>

  <!-- WRITE -->
  <rect x="20" y="105" width="110" height="50" rx="6" fill="#13161e" stroke="#5afa8e" stroke-width="1.5"/>
  <text x="75" y="135" fill="#e2e6f0" font-size="13" font-weight="600" text-anchor="middle">WRITE</text>

  <!-- WAL -->
  <rect x="190" y="20" width="170" height="55" rx="6" fill="#13161e" stroke="#1f2535"/>
  <text x="275" y="43" fill="#e2e6f0" font-size="13" font-weight="600" text-anchor="middle">WAL</text>
  <text x="275" y="60" fill="#7a8299" font-size="10.5" text-anchor="middle">append-only log</text>

  <!-- MemTable -->
  <rect x="190" y="185" width="170" height="55" rx="6" fill="#13161e" stroke="#1f2535"/>
  <text x="275" y="208" fill="#e2e6f0" font-size="13" font-weight="600" text-anchor="middle">MEMTABLE</text>
  <text x="275" y="225" fill="#7a8299" font-size="10.5" text-anchor="middle">skiplist</text>

  <!-- Immutable -->
  <rect x="410" y="185" width="170" height="55" rx="6" fill="#13161e" stroke="#1f2535"/>
  <text x="495" y="208" fill="#e2e6f0" font-size="13" font-weight="600" text-anchor="middle">IMMUTABLE</text>
  <text x="495" y="225" fill="#7a8299" font-size="10.5" text-anchor="middle">memtable</text>

  <!-- L0 -->
  <rect x="630" y="185" width="130" height="55" rx="6" fill="#13161e" stroke="#1f2535"/>
  <text x="695" y="208" fill="#5afa8e" font-size="13" font-weight="600" text-anchor="middle">L0</text>
  <text x="695" y="225" fill="#7a8299" font-size="10.5" text-anchor="middle">sstables</text>

  <!-- L1 -->
  <rect x="810" y="185" width="100" height="55" rx="6" fill="#13161e" stroke="#1f2535"/>
  <text x="860" y="217" fill="#5afa8e" font-size="13" font-weight="600" text-anchor="middle">L1</text>

  <!-- L2..Ln -->
  <rect x="960" y="185" width="210" height="55" rx="6" fill="#13161e" stroke="#1f2535"/>
  <text x="1065" y="217" fill="#5afa8e" font-size="13" font-weight="600" text-anchor="middle">L2 ... Ln</text>
</svg>
